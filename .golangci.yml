version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # errcheck, govet, ineffassign, staticcheck and unused are enabled by default in v2.
  # gosimple was merged into staticcheck; gofmt/goimports moved to the formatters section.
  enable:
    - goconst
    - gocyclo
    - gosec
    - misspell
    - unconvert
    - unparam
  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G404 # Use of weak random number generator (math/rand instead of crypto/rand)
      severity: medium
      confidence: medium
    misspell:
      locale: US
    staticcheck:
      # v2 folds stylecheck (ST*) and quickfix (QF*) into staticcheck. Keep the
      # linter surface this repository had under v1: staticcheck (SA*) and gosimple (S1*).
      checks:
        - all
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - goconst
          - gocyclo
          - gosec
          - misspell
          - unparam
          - unused
      - text: G402.*TLS MinVersion # Ignore TLS version warnings (can be configured via spec)
        linters:
          - gosec
      - text: is unused # Ignore unused functions (may be used via reflection or future features)
        linters:
          - unparam
          - unused
      - text: unnecessary conversion # Ignore unnecessary conversions (may be for clarity)
        linters:
          - unconvert
    paths:
      - bin
      - vendor

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - bin
      - vendor
